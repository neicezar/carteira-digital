name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contas_db
          POSTGRES_USER: contas_user
          POSTGRES_PASSWORD: contas_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U contas_user -d contas_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Verify
        run: ./mvnw verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: contas_db
          DB_USER: contas_user
          DB_PASSWORD: contas_pass
